<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Melo Quiz</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<button class="mode" onclick="toggleMode()">🌙</button>

<div class="container">
  <h1>Melo Online Quiz </h1>

  <input id="username" placeholder="Enter your name 👤" />

  <button onclick="startQuiz('easy')">Easy</button>
  <button onclick="startQuiz('medium')">Medium</button>
  <button onclick="startQuiz('hard')">Hard</button>

  <p id="best"></p>
</div>

<script>
function startQuiz(level){
  const name = document.getElementById("username").value.trim();
  if(!name){ alert("Enter your name 😊"); return; }
  localStorage.setItem("username", name);
  localStorage.setItem("level", level);
  window.location.href = "quiz.html";
}

function toggleMode(){
  document.body.classList.toggle("light");
  localStorage.setItem("mode",
    document.body.classList.contains("light") ? "light" : "dark");
}

if(localStorage.getItem("mode") === "light"){
  document.body.classList.add("light");
}

document.getElementById("best").innerText =
  `🏆 Best Score: ${localStorage.getItem("bestScore") || 0}`;
</script>
</body>
</html>
